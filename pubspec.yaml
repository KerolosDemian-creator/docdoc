name: docdoc
description: "DocDoc - an offline doctor appointment booking app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Immutable models / serialization annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Dependency injection
  get_it: ^9.2.1

  # Networking (kept for future backend integration)
  dio: ^5.11.0
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.3.1

  # Local persistence
  shared_preferences: ^2.5.5
  crypto: ^3.0.6

  # Utilities / UI
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  flutter_screenutil_plus: ^1.5.0
  dartz: ^0.10.1
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/Splash_Screen.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/Splash_Screen_12.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/svgs/
